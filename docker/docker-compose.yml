# Static personal site — TLS via ~/reverse-proxy (Caddy on shared "proxy" network).
# Serves the Next.js static export from ./out (run npm run build first).

services:
  web:
    image: nginx:alpine
    container_name: personal-website
    restart: always
    expose:
      - "80"
    volumes:
      - ./out:/usr/share/nginx/html:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
